[project]
name = "officeops-runtime-py"
version = "0.1.0"
description = "LangGraph-based runtime backend for OfficeOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.29",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "firebase-admin>=6.6.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.5",
  "mypy>=1.14.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["officeops_runtime"]
